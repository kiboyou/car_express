services:
  laravel_app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
    ports:
      - "8005:80"
    extra_hosts:
      - "car_express.local:127.0.0.1"

  mysql_db:
    image: mysql:8.0
    container_name: mysql_db
    ports:
      - "3609:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=Abkm@Service225
      - MYSQL_DATABASE=dbcarexpress
                                               
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql_db
      - PMA_USER=root
      - PMA_PASSWORD=Abkm@Service225

volumes:
  mysql_data:
